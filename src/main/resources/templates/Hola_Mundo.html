<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Proyecto Librería</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center font-sans antialiased">

    <div class="max-w-xl w-full mx-4 p-8 bg-slate-800/80 backdrop-blur border border-slate-700 rounded-2xl shadow-2xl text-center space-y-6">
    
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            Spring Boot Activo
        </div>

        <h1 class="text-4xl sm:text-5xl font-extrabold bg-gradient-to-r from-teal-400 via-sky-400 to-indigo-400 bg-clip-text text-transparent">
            ¡Hola Mundo!
        </h1>

        <p class="text-lg text-slate-300 leading-relaxed" th:text="${mensaje}">
            Mensaje por defecto si falla Thymeleaf...
        </p>

        <div class="p-4 bg-slate-900/60 rounded-xl border border-slate-700/50 text-left space-y-2 text-sm text-slate-400">
            <div class="flex justify-between items-center">
                <span>Estado Servidor:</span>
                <span class="text-emerald-400 font-mono">200 OK</span>
            </div>
            <div class="flex justify-between items-center">
                <span>Framework:</span>
                <span class="text-sky-400 font-mono">Spring Boot 3 / MVC</span>
            </div>
        </div>

        <p class="text-xs text-slate-500 pt-2 border-t border-slate-700/50">
            Producto 1 • Aplicación back-end con Java en servidores de aplicaciones
        </p>
    </div>

</body>
</html>
