version: '3.8'

services:

  app:
    build: .
    container_name: app_libreria
    restart: always
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:8080"
    environment:
      DB_HOST: host.docker.internal
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - libreria-net

networks:
  libreria-net:
    driver: bridge